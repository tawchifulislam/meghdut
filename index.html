<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meghdut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body class="min-h-screen text-white overflow-x-hidden">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div
    class="relative z-10 min-h-screen flex flex-col items-center px-5 sm:px-8 md:px-10 pt-10 sm:pt-14 md:pt-16 lg:pt-20 pb-16">
    <div class="w-full max-w-sm sm:max-w-xl md:max-w-2xl lg:max-w-3xl xl:max-w-4xl">

      <div class="mb-10 sm:mb-12 md:mb-14 fade-up flex items-start justify-between" style="animation-delay:0s">
        <div>
          <p class="label-text mb-2">Weather</p>
          <h1 class="display-font text-5xl sm:text-6xl md:text-7xl font-medium tracking-tight">Meghdut</h1>
        </div>
        <div class="unit-toggle mt-2">
          <button id="unitC" class="unit-btn active" aria-label="Celsius">°C</button>
          <button id="unitF" class="unit-btn" aria-label="Fahrenheit">°F</button>
        </div>
      </div>

      <div class="mb-10 sm:mb-12 md:mb-14 fade-up" style="animation-delay:0.08s">
        <div class="search-wrap">
          <input id="cityInput" type="text" placeholder="Enter city name" class="search-field"
            onkeydown="if(event.key==='Enter') fetchWeather()" autocomplete="off" />
          <button onclick="fetchWeather()" class="search-arrow" aria-label="Search">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </div>
        <p id="errorMsg" class="hidden mt-3 text-red-400/80 text-sm font-light"></p>
        <div id="recentChips" class="flex flex-wrap gap-2 mt-3"></div>
      </div>

      <div id="emptyState" class="fade-up" style="animation-delay:0.16s">
        <div class="card p-10 sm:p-14 text-center">
          <div class="text-5xl sm:text-6xl mb-5 opacity-25">◎</div>
          <p class="display-font text-xl sm:text-2xl font-medium mb-3 opacity-50">No data yet</p>
          <p class="text-white/25 text-sm sm:text-base leading-relaxed font-light">
            Search any city above to see<br />live weather conditions.
          </p>
        </div>
      </div>

      <div id="loadingState" class="hidden">
        <div class="card p-10 sm:p-14 text-center">
          <div class="loading-ring mx-auto mb-5"></div>
          <p class="text-white/30 text-sm font-light tracking-widest uppercase">Fetching conditions…</p>
        </div>
      </div>

      <div id="weatherCard" class="hidden space-y-3 sm:space-y-4">

        <div class="card p-6 sm:p-8 md:p-10 fade-up">

          <div class="flex items-start justify-between gap-4 mb-8 sm:mb-10">
            <div>
              <h2 id="cityName"
                class="display-font text-3xl sm:text-4xl md:text-5xl font-medium tracking-tight leading-none mb-2">
              </h2>
              <p id="countryDate" class="text-white/35 text-xs sm:text-sm font-light tracking-wide"></p>
            </div>
            <span id="weatherDesc"
              class="text-white/35 text-xs sm:text-sm font-light text-right leading-relaxed shrink-0 max-w-25 sm:max-w-32.5 mt-1">
            </span>
          </div>

          <div class="flex items-end justify-between mb-8 sm:mb-10">
            <div>
              <div id="tempDisplay" class="temp-num leading-none mb-2"></div>
              <p id="feelsLike" class="text-white/30 text-xs sm:text-sm font-light"></p>
            </div>
            <div id="weatherIcon" class="weather-icon"></div>
          </div>

          <div class="w-full h-px bg-white/6 mb-6 sm:mb-8"></div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            <div class="stat-cell">
              <p class="stat-label">Humidity</p>
              <p id="humidity" class="stat-value"></p>
            </div>
            <div class="stat-cell">
              <p class="stat-label">Wind</p>
              <p id="windSpeed" class="stat-value"></p>
            </div>
            <div class="stat-cell">
              <p class="stat-label">Visibility</p>
              <p id="visibility" class="stat-value"></p>
            </div>
            <div class="stat-cell">
              <p class="stat-label">Pressure</p>
              <p id="pressure" class="stat-value"></p>
            </div>
          </div>

        </div>

        <div class="grid grid-cols-2 gap-3 sm:gap-4 fade-up" style="animation-delay:0.06s">

          <div class="card p-5 sm:p-6 md:p-7 flex flex-col gap-4">
            <p class="label-text">Sunrise</p>
            <div class="flex items-center gap-3 sm:gap-4">
              <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="18" x2="22" y2="18" />
                <path d="M6 18a6 6 0 0 1 12 0" />
                <polyline points="9 10 12 7 15 10" />
                <line x1="12" y1="7" x2="12" y2="12" />
              </svg>
              <p id="sunrise" class="display-font text-xl sm:text-2xl md:text-3xl font-medium tracking-tight"></p>
            </div>
          </div>

          <div class="card p-5 sm:p-6 md:p-7 flex flex-col gap-4">
            <p class="label-text">Sunset</p>
            <div class="flex items-center gap-3 sm:gap-4">
              <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="18" x2="22" y2="18" />
                <path d="M6 18a6 6 0 0 1 12 0" />
                <polyline points="9 9 12 12 15 9" />
                <line x1="12" y1="6" x2="12" y2="12" />
              </svg>
              <p id="sunset" class="display-font text-xl sm:text-2xl md:text-3xl font-medium tracking-tight"></p>
            </div>
          </div>

        </div>

        <div class="card p-5 sm:p-6 md:p-8 fade-up" style="animation-delay:0.09s">
          <p class="label-text mb-4 sm:mb-6">Sun Path</p>
          <div id="sunPath"></div>
          <p id="sunPathCaption" class="text-white/25 text-xs mt-3 font-light"></p>
        </div>

        <div class="card p-5 sm:p-6 md:p-8 fade-up" style="animation-delay:0.12s">
          <p class="label-text mb-4 sm:mb-6">5-Day Forecast</p>
          <div id="forecastContainer" class="grid grid-cols-5 gap-1 sm:gap-3 md:gap-4"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
